name: 用户故事 (User Story)
description: 创建符合课程检查点规范的用户故事 Issue（功能需求 / 非功能需求）
title: "[US-XX] "
labels:
  - story
body:
  - type: markdown
    attributes:
      value: |
        请按模板完整填写用户故事与验收标准，并在右侧栏指定 **Assignees（负责人）**。
        参考文档：`doc/README.md` 与 `doc/用户故事清单.pdf`。
  - type: input
    id: story_id
    attributes:
      label: 故事编号
      description: 填写用户故事编号（如 US-06）
      placeholder: US-XX
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 类别与优先级
      options:
        - P0（增量一 · MVP）
        - P1（增量二）
        - P2（增量三）
        - NFR（非功能需求）
    validations:
      required: true
  - type: dropdown
    id: stakeholder
    attributes:
      label: 干系人角色
      options:
        - 委托学生（SH-01）
        - 代取学生（SH-02）
        - 平台管理员（SH-03）
    validations:
      required: true
  - type: textarea
    id: user_story
    attributes:
      label: 用户故事描述（作为 / 我想 / 以便）
      description: 使用标准三段式描述需求主体、动作与业务价值
      value: |
        - **作为**：
        - **我想**：
        - **以便**：
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 验收标准（Given / When / Then）
      description: 列出可验证的正常流程与边界/异常场景
      value: |
        **场景 1：**
        - **Given**：
        - **When**：
        - **Then**：

        **场景 2（边界/异常，如有）：**
        - **Given**：
        - **When**：
        - **Then**：
    validations:
      required: true
  - type: textarea
    id: research_evidence
    attributes:
      label: 关联调研证据链接
      description: 关联痛点编号（如 P-01 / P-02 / P-03）及仓库内的调研纪要/证据链接
      placeholder: |
        - 关联痛点：P-01（https://github.com/GreyBlue0122/Software/blob/main/doc/README.md#61-%E4%B8%BB%E8%A6%81%E7%97%9B%E7%82%B9）
        - 调研证据链接：
    validations:
      required: true
